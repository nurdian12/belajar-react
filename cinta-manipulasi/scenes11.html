<!doctype html>
<html><head><meta charset="utf-8"><title>red flag vs green flag</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const c = document.getElementById('c'), g = c.getContext('2d');
const SANS = '"Inter","DejaVu Sans",sans-serif';
const WATERMARK = '@kenalipolanya.id';
const AMBER = '#f5b63c', RED = '#ff6b5e', BLUE = '#53bdeb';
const REVEAL = 8.3;

/* ---------- util ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const rad = d => d * Math.PI / 180;
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const win = (t, a, b, f = .35) => seg(t, a, a + f) * (1 - seg(t, b - f, b));

function font(size, w = 800) { return `${w} ${size}px ${SANS}`; }
function text(s, x, y, o = {}) {
  const { size = 30, color = '#fff', align = 'center', w = 800, ls = 0, alpha = 1 } = o;
  if (alpha <= 0) return;
  g.save(); g.globalAlpha *= alpha; g.font = font(size, w); g.letterSpacing = ls + 'px';
  g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle'; g.fillText(s, x, y); g.restore();
}
function measure(s, size, w = 800, ls = 0) { g.save(); g.font = font(size, w); g.letterSpacing = ls + 'px'; const m = g.measureText(s).width; g.restore(); return m; }
function rich(parts, x, y, o = {}) {
  const { size = 30, w = 800, ls = 0, alpha = 1 } = o;
  const ws = parts.map(p => measure(p[0], size, w, ls)); const tot = ws.reduce((a, b) => a + b, 0);
  let cx = x - tot / 2;
  parts.forEach((p, i) => { text(p[0], cx, y, { size, w, ls, alpha, align: 'left', color: p[1] || '#fff' }); cx += ws[i]; });
}
function fitSize(parts, maxW, size) { const s = parts.map(p => p[0]).join(''); while (measure(s, size) > maxW && size > 20) size -= 1; return size; }
function rrect(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function line(x1, y1, x2, y2, col, lw, alpha = 1) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha *= alpha; g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); g.restore();
}
function glow(x, y, r, col, a = 1) {
  if (a <= 0) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.save(); g.globalAlpha *= a; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.restore();
}

/* ---------- figure ---------- */
function fig(x, y, o = {}) {
  const s = o.s ?? 1, col = o.color || '#f2f2f2', d = o.dir || 1, lw = 8 * s;
  const legs = (o.legs || [0, 0]).map((a, i) => a + (i ? -6 : 6));
  const arms = (o.arms || [0, 0]).map((a, i) => a + (i ? -16 : 16));
  const lean = o.lean || 0, tilt = o.tilt || 0;
  const LL = 58 * s, TL = 60 * s, AL = 46 * s, HR = 20 * s;
  const maxL = Math.max(Math.abs(legs[0]), Math.abs(legs[1]));
  const hip = { x, y: y - LL * Math.cos(rad(maxL)) };
  const neck = { x: hip.x + d * TL * Math.sin(rad(lean)), y: hip.y - TL * Math.cos(rad(lean)) };
  const hd = HR + 3 * s;
  const head = { x: neck.x + d * hd * Math.sin(rad(lean + tilt)), y: neck.y - hd * Math.cos(rad(lean + tilt)) };
  const sh = { x: neck.x - d * 8 * s * Math.sin(rad(lean)), y: neck.y + 8 * s * Math.cos(rad(lean)) };
  const feet = legs.map(a => ({ x: hip.x + d * LL * Math.sin(rad(a)), y: hip.y + LL * Math.cos(rad(a)) }));
  const hands = arms.map(a => ({ x: sh.x + d * AL * Math.sin(rad(a)), y: sh.y + AL * Math.cos(rad(a)) }));
  g.save(); g.globalAlpha *= (o.alpha ?? 1); g.lineCap = 'round';
  // dark outline then fill colour (satulangkah look)
  [[lw + 5 * s, 'rgba(10,10,14,.9)'], [lw, col]].forEach(([w, cc]) => {
    g.strokeStyle = cc; g.lineWidth = w;
    g.beginPath(); g.moveTo(hip.x, hip.y); g.lineTo(neck.x, neck.y); g.stroke();
    feet.forEach(f => { g.beginPath(); g.moveTo(hip.x, hip.y); g.lineTo(f.x, f.y); g.stroke(); });
    hands.forEach(h => { g.beginPath(); g.moveTo(sh.x, sh.y); g.lineTo(h.x, h.y); g.stroke(); });
  });
  g.fillStyle = 'rgba(10,10,14,.9)'; g.beginPath(); g.arc(head.x, head.y, HR + 2.5 * s, 0, 7); g.fill();
  g.fillStyle = col; g.beginPath(); g.arc(head.x, head.y, HR, 0, 7); g.fill();
  g.restore();
  return { hip, neck, head, sh, feet, hands };
}
const walk = (ph, amp = 26) => ({ legs: [amp * Math.sin(ph), -amp * Math.sin(ph)], arms: [-amp * Math.sin(ph), amp * Math.sin(ph)] });
const GREY = '#a9adb6', DARKF = '#7d828c';

/* ================= RED FLAG VS GREEN FLAG ================= */
const INK = '#15161a', GREEN = '#58c47f', PAPER = '#f3f0e8';
const DURV = 22, T0 = 1.6, TD = 3.4, NT = 5, TEND = T0 + NT * TD;
const TOPICS = [
  { t: 'SAAT CEMBURU', red: 'Hapus semua kontak\nyang kamu curigai!', rtag: 'KONTROL', green: 'Aku percaya kamu.\nKabarin kalau udah sampai.', gtag: 'PERCAYA' },
  { t: 'SAAT MARAH', red: '(Diam 3 hari,\nnggak mau jawab)', rtag: 'MENGHUKUM', green: 'Aku butuh 10 menit,\nnanti kita ngobrol.', gtag: 'KOMUNIKASI' },
  { t: 'SAAT SALAH', red: 'Gara-gara kamu\naku jadi begini!', rtag: 'MENYALAHKAN', green: 'Maaf, itu salahku.\nAku akan perbaiki.', gtag: 'BERTANGGUNG JAWAB' },
  { t: 'SOAL TEMAN', red: 'Jangan main sama dia.\nDia pengaruh buruk!', rtag: 'MENGISOLASI', green: 'Seru-seruan sama\ntemanmu ya!', gtag: 'MENDUKUNG' },
  { t: 'SOAL KEPUTUSAN', red: 'Pokoknya ikut\nkemauan aku!', rtag: 'MEMAKSA', green: 'Menurut kamu\nenaknya gimana?', gtag: 'MENGHARGAI' },
];
const bgFlat = () => { g.fillStyle = PAPER; g.fillRect(0, 0, W, H); g.fillStyle = 'rgba(0,0,0,.035)'; for (let i = 0; i < 240; i++) { g.beginPath(); g.arc(rnd(i) * W, rnd(i + 99) * H, 1 + rnd(i + 7) * 2, 0, 7); g.fill(); } };
function flagIcon(x, y, col, s = 1) { g.save(); g.translate(x, y); g.scale(s, s); g.strokeStyle = '#fff'; g.lineWidth = 5; g.lineCap = 'round'; g.beginPath(); g.moveTo(0, 14); g.lineTo(0, -22); g.stroke(); g.fillStyle = col; g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.moveTo(2, -22); g.lineTo(28, -14); g.lineTo(2, -4); g.closePath(); g.fill(); g.stroke(); g.restore(); }
function mark(x, y, ok, p) {
  if (p <= 0) return; const k = .6 + .4 * Math.min(1.25, eo(p) + Math.sin(p * Math.PI) * .25);
  g.save(); g.translate(x, y); g.scale(k, k); g.globalAlpha = clamp(p * 2); g.fillStyle = ok ? GREEN : RED; g.strokeStyle = '#fff'; g.lineWidth = 5; g.beginPath(); g.arc(0, 0, 38, 0, 7); g.fill(); g.stroke();
  g.strokeStyle = '#fff'; g.lineWidth = 9; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
  if (ok) { g.moveTo(-17, 2); g.lineTo(-5, 15); g.lineTo(19, -13); } else { g.moveTo(-14, -14); g.lineTo(14, 14); g.moveTo(14, -14); g.lineTo(-14, 14); }
  g.stroke(); g.restore();
}
function drawCard(red, tp, u) {
  const tIn = red ? .2 : 1.7, enter = seg(u, tIn, tIn + .5), exit = seg(u, TD - .4, TD);
  const off = (red ? -1 : 1) * 1150 * ((1 - eo(enter)) + eio(exit)); if (enter <= 0 || exit >= 1) return;
  const y = red ? 470 : 960, h = 440, col = red ? RED : GREEN;
  g.save(); g.translate(off, 0);
  g.fillStyle = INK; rrect(66, y + 10, 960, h, 34); g.fill();
  const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, red ? '#6b1a16' : '#145236'); gr.addColorStop(1, red ? '#3d0e0c' : '#0b2e1e');
  g.fillStyle = gr; g.strokeStyle = col; g.lineWidth = 7; rrect(60, y, 960, h, 34); g.fill(); g.stroke();
  // label chip
  const lab = red ? 'RED FLAG' : 'GREEN FLAG', lw = measure(lab, 26, 800, 3) + 90;
  g.fillStyle = col; rrect(90, y + 24, lw, 52, 26); g.fill(); flagIcon(120, y + 52, red ? '#ffb4ad' : '#b9f0cf', .9); text(lab, 150, y + 51, { size: 26, ls: 3, align: 'left', color: '#fff' });
  // figure
  const fy = y + h - 46; g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 3; g.beginPath(); g.moveTo(90, fy); g.lineTo(330, fy); g.stroke();
  if (red) {
    const sh = Math.sin(u * 22) * 3 * win(u, tIn + .4, tIn + 1.5, .1);
    fig(190 + sh, fy, { s: 1.15, lean: 18, tilt: 6, arms: [100, -20], color: '#ffffff' });
    for (let i = 0; i < 3; i++) { const a = seg(u, tIn + .5, tIn + .8); g.save(); g.globalAlpha = a; g.strokeStyle = '#ffd0cb'; g.lineWidth = 5; g.lineCap = 'round'; g.beginPath(); g.moveTo(262 + i * 14, y + 165 - i * 22); g.lineTo(282 + i * 14, y + 155 - i * 28); g.stroke(); g.restore(); }
  } else {
    fig(190, fy, { s: 1.15, lean: 0, tilt: -4, arms: [58, -58], color: '#ffffff' });
    const a = seg(u, tIn + .5, tIn + .9); text('♥', 190, y + 128 - 14 * eo(a), { size: 46, color: '#ff7a8a', alpha: a, w: 800 });
  }
  // speech bubble
  const bt = tIn + .35, ba = eo(seg(u, bt, bt + .35)), lines = (red ? tp.red : tp.green).split('\n');
  let sz = 42; while (Math.max(...lines.map(l => measure(l, sz, 800))) > 560 && sz > 28) sz -= 1;
  const bw = 640, bh = 56 + lines.length * sz * 1.25, bx = 360, by = y + 110;
  g.save(); g.translate(bx + bw / 2, by + bh / 2); g.scale(.88 + .12 * ba, .88 + .12 * ba); g.globalAlpha = ba;
  g.fillStyle = '#fff'; g.strokeStyle = INK; g.lineWidth = 5; g.beginPath(); g.moveTo(-bw / 2 + 4, bh / 2 - 60); g.lineTo(-bw / 2 - 36, bh / 2 - 20); g.lineTo(-bw / 2 + 4, bh / 2 - 20); g.closePath(); g.fill(); g.stroke();
  rrect(-bw / 2, -bh / 2, bw, bh, 30); g.fill(); g.stroke(); g.fillStyle = '#fff'; g.fillRect(-bw / 2 - 2, bh / 2 - 58, 8, 36);
  lines.forEach((l, i) => text(l, 0, (i - (lines.length - 1) / 2) * sz * 1.25 + 2, { size: sz, color: INK })); g.restore();
  // mark + tag
  mark(980, y + 52, !red, seg(u, tIn + .55, tIn + .95));
  const tg = '= ' + (red ? tp.rtag : tp.gtag), ta = eo(seg(u, tIn + .9, tIn + 1.2)), tw = measure(tg, 30, 800, 2) + 56;
  g.save(); g.globalAlpha = ta; g.translate(0, (1 - ta) * 14); g.fillStyle = col; g.strokeStyle = '#fff'; g.lineWidth = 4; rrect(1000 - tw, y + h - 84, tw, 56, 28); g.fill(); g.stroke(); text(tg, 1000 - tw / 2, y + h - 55, { size: 30, ls: 2, color: '#fff' }); g.restore();
  g.restore();
}
function scene11(t) {
  bgFlat();
  const ti = eo(seg(t, 0, .5));
  text('RED FLAG VS GREEN FLAG', W / 2, 300, { size: 46, color: INK, alpha: ti });
  // topic chip
  const k = clamp(Math.floor((t - T0) / TD), 0, NT - 1), u = t - T0 - k * TD;
  if (t >= T0 && t < TEND) {
    const tp = TOPICS[k], lab = `${k + 1}/${NT}  ${tp.t}`, cw = measure(lab, 30, 800, 3) + 70, pop = eo(seg(u, 0, .25)) * (1 - eo(seg(u, TD - .3, TD)));
    g.save(); g.globalAlpha = clamp(pop * 1.5); g.translate(W / 2, 395); g.scale(.85 + .15 * pop, .85 + .15 * pop); g.fillStyle = INK; rrect(-cw / 2, -30, cw, 60, 30); g.fill(); text(lab, 0, 1, { size: 30, ls: 3, color: '#fff' }); g.restore();
    drawCard(true, tp, u); drawCard(false, tp, u);
    for (let i = 0; i < NT; i++) { g.fillStyle = i === k ? INK : 'rgba(0,0,0,.2)'; g.beginPath(); g.arc(W / 2 + (i - 2) * 38, 1440, i === k ? 11 : 8, 0, 7); g.fill(); }
  }
  // intro
  const ia = (1 - seg(t, T0 - .4, T0)) * eo(seg(t, .1, .6));
  if (ia > 0) {
    g.save(); g.globalAlpha = ia; text('RED FLAG', W / 2, 760, { size: 120, color: RED }); text('VS', W / 2, 890, { size: 64, color: INK }); text('GREEN FLAG', W / 2, 1020, { size: 120, color: GREEN });
    text('Bedain 5 hal ini.', W / 2, 1180, { size: 48, color: INK, w: 700 }); g.restore();
  }
  // outro
  const oa = eo(seg(t, TEND, TEND + .8));
  if (oa > 0) {
    g.fillStyle = `rgba(21,22,26,${.96 * oa})`; g.fillRect(0, 0, W, H);
    const l1 = eo(seg(t, TEND + .4, TEND + 1.1)), l2 = eo(seg(t, TEND + 1.0, TEND + 1.7)), l3 = eo(seg(t, TEND + 1.6, TEND + 2.3));
    text('CINTA YANG SEHAT', W / 2, 600 + (1 - l1) * 20, { size: 70, alpha: l1, color: '#fff' });
    text('bikin kamu merasa', W / 2, 700 + (1 - l2) * 20, { size: 50, alpha: l2, color: '#c5cde0', w: 700 });
    rich([['AMAN', GREEN], [', bukan ', '#c5cde0'], ['TAKUT.', RED]], W / 2, 830 + (1 - l3) * 20, { size: 76, alpha: l3 });
    const ca = eo(seg(t, TEND + 2.3, TEND + 3.0));
    g.save(); g.globalAlpha = ca; g.fillStyle = '#ffd23f'; g.strokeStyle = '#fff'; g.lineWidth = 4; rrect(110, 1010, 860, 190, 36); g.fill(); g.stroke();
    text('Berapa red flag yang pernah', W / 2, 1075, { size: 40, color: INK }); text('kamu alami? Komen angkanya!', W / 2, 1135, { size: 40, color: INK }); g.restore();
    text('SIMPAN & KIRIM KE TEMANMU', W / 2, 1300, { size: 34, ls: 3, color: '#c5cde0', alpha: eo(seg(t, TEND + 2.9, TEND + 3.4)) });
  }
  // watermark
  g.save(); g.fillStyle = oa > .5 ? 'rgba(255,255,255,.14)' : INK; rrect(W / 2 - 196, 1512, 392, 54, 27); g.fill(); g.restore();
  text(WATERMARK, W / 2, 1539, { size: 28, ls: 1, color: '#fff' });
  const fi = seg(t, 0, .3); if (fi < 1) { g.fillStyle = `rgba(243,240,232,${1 - fi})`; g.fillRect(0, 0, W, H); }
}
const CUES11 = (() => {
  const c = [[.2, 'whoosh', .5], [.3, 'pop', .6], [1.0, 'riser', .45]];
  TOPICS.forEach((_, k) => { const a = T0 + k * TD; c.push([a, 'pop', .6], [a + .2, 'whoosh', .5], [a + .75, 'buzz', .5], [a + .8, 'thud', .35], [a + 1.7, 'whoosh', .5], [a + 2.2, 'ding', .8], [a + 2.25, 'sparkle', .35]); });
  c.push([TEND, 'whoosh', .5], [TEND + .5, 'thud', .5], [TEND + 1.0, 'tick', .5], [TEND + 1.6, 'tick', .5], [TEND + 2.3, 'ding', .8], [TEND + 3.0, 'pop', .6]);
  return c.sort((a, b) => a[0] - b[0]);
})();
window.CUES = { 1: CUES11 }; window.DUR = DURV;
window.render = (id, t) => { g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; scene11(t); };
Promise.all([document.fonts.load('800 30px "Inter"'), document.fonts.load('700 30px "Inter"')]).then(() => { window.ready = true; });
</script></body></html>
