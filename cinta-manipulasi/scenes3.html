/* ================= utils ================= */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);

const rp = n => 'Rp ' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');

function font(size, w = 800) { return `${w} ${size}px ${SANS}`; }
function text(s, x, y, o = {}) {
  const { size = 30, color = INK, align = 'center', w = 800, ls = 0, alpha = 1 } = o;
  if (alpha <= 0) return;
  g.save(); g.globalAlpha *= alpha; g.font = font(size, w); g.letterSpacing = ls + 'px';
  g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle'; g.fillText(s, x, y); g.restore();
}
function measure(s, size, w = 800, ls = 0) { g.save(); g.font = font(size, w); g.letterSpacing = ls + 'px'; const m = g.measureText(s).width; g.restore(); return m; }
function rrect(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function ln(x1, y1, x2, y2, col = INK, lw = 6, alpha = 1) {

  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); g.restore();
}
function glow(x, y, r, col, a = 1) {

  g.save(); g.globalAlpha *= a; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.restore();
}

/* ================= character (ala ilustrasi referensi) ================= */
const POSES = {
  idle: { L: [-36, 128, 1], R: [36, 128, -1] },
  cross: { L: [64, 46, 1], R: [-64, 46, -1] },
  up: { L: [-66, -84, -1], R: [66, -84, 1] },
  point: { L: [-36, 128, 1], R: [124, -10, 1] },
  phone: { L: [-36, 128, 1], R: [56, 50, -1] },
  stop: { L: [-36, 128, 1], R: [96, -62, 1] },
  shrug: { L: [-84, 40, 1], R: [84, 40, -1] },
  grab: { L: [-36, 128, 1], R: [122, 38, 1] },
  hold2: { L: [58, 66, 1], R: [80, 52, -1] },
  hands: { L: [-70, 10, 1], R: [70, 10, -1] },

function mixPose(a, b, p) {
  const A = typeof a === 'string' ? POSES[a] : a, B = typeof b === 'string' ? POSES[b] : b;

function ik(sx, sy, tx, ty, l1, l2, bend) {

function hair(kind) {

function brow(x1, y1, x2, y2, cv) { g.beginPath(); g.moveTo(x1, y1); g.quadraticCurveTo((x1 + x2) / 2, (y1 + y2) / 2 - cv, x2, y2); g.stroke(); }

  else if (st === 'shock') { [-ex, ex].forEach(x => { g.fillStyle = '#fff'; g.beginPath(); g.arc(x, ey, 11, 0, 7); g.fill(); g.stroke(); g.fillStyle = INK; g.beginPath(); g.arc(x + look, ey, 3.5, 0, 7); g.fill(); }); }
  else { [-ex, ex].forEach(x => { g.beginPath(); g.ellipse(x + look, ey + (st === 'sad' ? 3 : 0), eyeRx, blink ? 1.2 : eyeRy, 0, 0, 7); g.fill(); }); }

  else if (mouth === 'smirk') { g.moveTo(-18, 24); g.quadraticCurveTo(10, 26, 34, 8); g.stroke(); }
  else if (mouth === 'sad') { g.moveTo(-20, 32); g.quadraticCurveTo(0, 14, 20, 32); g.stroke(); }
  else if (mouth === 'flat') { g.moveTo(-18, 26); g.lineTo(18, 26); g.stroke(); }
  else if (mouth === 'flatdown') { g.moveTo(-22, 32); g.quadraticCurveTo(0, 20, 22, 32); g.stroke(); }
  else if (mouth === 'wavy') { g.moveTo(-22, 28); g.quadraticCurveTo(-11, 20, 0, 28); g.quadraticCurveTo(11, 36, 22, 28); g.stroke(); }
  else if (mouth === 'o') { g.ellipse(0, 28, 10, 13, 0, 0, 7); g.fill(); }
  else if (mouth === 'grin') { g.moveTo(-28, 15); g.quadraticCurveTo(0, 22, 28, 15); g.quadraticCurveTo(24, 44, 0, 44); g.quadraticCurveTo(-24, 44, -28, 15); g.fill(); g.fillStyle = '#e86a6a'; g.beginPath(); g.ellipse(0, 40, 12, 5, 0, 0, 7); g.fill(); g.fillStyle = INK; }

  if (fx.includes('sweat')) { const bb = Math.sin(NOW * 6) * 2; g.fillStyle = '#6ec1ff'; g.strokeStyle = INK; g.lineWidth = 3; g.beginPath(); g.moveTo(46, -26 + bb); g.quadraticCurveTo(58, -6 + bb, 46, -4 + bb); g.quadraticCurveTo(34, -6 + bb, 46, -26 + bb); g.fill(); g.stroke(); }

  if (fx.includes('anger')) { const k = 1 + Math.sin(NOW * 12) * .12; g.save(); g.translate(40, -48); g.scale(k, k); g.strokeStyle = RED; g.lineWidth = 5; [[-10, -3, -3, -3], [-3, -3, -3, -10], [10, -3, 3, -3], [3, -3, 3, -10], [-10, 3, -3, 3], [-3, 3, -3, 10], [10, 3, 3, 3], [3, 3, 3, 10]].forEach(a => { g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(a[2], a[3]); g.stroke(); }); g.restore(); }

}
function man(x, y, o = {}) {
  const s = o.s ?? 1, d = o.dir ?? 1, lean = o.lean || 0, tie = o.tie || INK, ph = o.walk, fx = o.fx || [];

  let pose = typeof o.pose === 'string' ? POSES[o.pose] : (o.pose || POSES.idle);
  const base = g.getTransform().inverse();
  g.save(); g.globalAlpha *= (o.alpha ?? 1);
  g.translate(x, y + bob * s); g.scale(d * s, s);
  g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = INK; g.fillStyle = '#fff'; g.lineWidth = 6.2;

    ln(0, HIP, fxx, fyy, INK, 6.2);
    g.fillStyle = '#fff'; g.beginPath(); g.ellipse(fxx + 15, fyy + 3, 28, 9, 0, 0, 7); g.fill(); g.stroke();
  });

/* ================= props ================= */
function balloon(x, y, str, o = {}) {

  g.save(); g.globalAlpha *= clamp(a * 1.5); const k = .6 + .4 * bounce(clamp(a)); g.translate(x, y); g.scale(k, k);

}
function say(h0, str, side = 'u', o = {}) {

function header(t, pill, h1, h2) {

      const B = man(bx, FL, { s, dir: -1, tie: RED, hair: 'slick', pose: t < 7.9 ? 'point' : (t < 13.5 ? 'shrug' : 'idle'), face: t < 7.9 ? 'smug' : t < 12.9 ? 'shock' : 'sad', walk: t > 13.5 && t < 14.8 ? t * 8 : undefined, seed: 2 });
      NODES.forEach(([lab, nx, ny], i) => {

        const ox = back ? lerp(nx + (i < 2 ? -1 : 1) * 70, nx, inA) : nxp, oy = back ? lerp(ny - 60, ny, inA) : nyp;

      }

      say(B, 'NONGKRONG TUH\nBUANG WAKTU.', 'u', { a: win(t, 5.0, 6.9), size: 25 });
      say(B, 'KAMU CUMA\nBUTUH AKU.', 'u', { a: win(t, 6.9, 8.5), size: 27 });
      say(A, 'HALO... KANGEN\nNGOBROL.', 'r', { a: win(t, 8.9, 11.0), size: 26, oy: 90 });

      say(A, 'AKU GAK\nSENDIRIAN.', 'r', { a: win(t, 14.0, 17.6), size: 30, oy: 90 });
    });
  }
};
