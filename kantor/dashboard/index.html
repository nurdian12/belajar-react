<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kantor</title>
<style>
  :root { --bg:#f6f1ea; --card:#fff; --ink:#1f1b16; --mut:#7a7168; --line:#e6ddd1; --acc:#d9622b; --ok:#2e7d4f; --bad:#b3372c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161412; --card:#211e1b; --ink:#f1ebe3; --mut:#9c9288; --line:#332e29; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,sans-serif; }
  main { max-width:880px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:22px; margin:0 0 4px; } h2 { font-size:13px; margin:28px 0 10px; color:var(--mut); text-transform:uppercase; letter-spacing:.06em; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input { flex:1; min-width:0; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
  button { padding:8px 14px; border:0; border-radius:8px; background:var(--acc); color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button.ok { background:var(--ok); } button.bad { background:var(--bad); }
  .tag { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--mut); }
  .tag.menunggu { color:var(--acc); border-color:var(--acc); } .tag.disetujui { color:var(--ok); border-color:var(--ok); }
  .tag.ditolak,.tag.gagal { color:var(--bad); border-color:var(--bad); }
  .mut { color:var(--mut); font-size:13px; } pre { white-space:pre-wrap; margin:8px 0; font:inherit; }
  ul { margin:6px 0 0; padding-left:20px; }
  #scene3d { position:relative; height:clamp(300px, 52vw, 460px); margin:18px 0 0; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:linear-gradient(#cfe8f7,#eaf4fa); }
  @media (prefers-color-scheme: dark) { #scene3d { background:linear-gradient(#1b2a3b,#2b3d52); } }
  #scene3d canvas { position:absolute; inset:0; }
  .lbl3d { position:absolute; left:0; top:0; pointer-events:none; white-space:nowrap; font-size:12px; line-height:1.3; background:#fff; color:#1f1b16; border-radius:8px; padding:3px 8px; box-shadow:0 2px 8px #0003; text-align:center; z-index:1; }
  .lbl3d .j { display:none; } .lbl3d { font-size:11px; padding:2px 7px; } .lbl3d .s { display:block; font-weight:600; }
  .lbl3d[data-s="kerja"] .s { color:#0e7c6b; } .lbl3d[data-s="tunggu"] { background:#fdecd2; } .lbl3d[data-s="tunggu"] .s { color:#a3480a; } .lbl3d[data-s="belum"] { opacity:.7; }
</style>
</head>
<body>
<main>
  <h1>Kantor</h1>
  <div class="mut">Dashboard persetujuan. Semua jalan di PC kamu.</div>

  <div id="scene3d" hidden>
    <div class="row" style="position:absolute;top:10px;right:10px;z-index:2"><button class="ghost" id="demo3d" aria-pressed="false">Demo animasi</button></div>
  </div>

  <h2>Agent</h2>
  <div id="agents" class="row"></div>

  <h2>Topik dari Rina</h2>
  <div class="row" style="margin-bottom:10px">
    <button id="riset">Minta Rina riset sekarang</button>
    <span class="mut" id="risetInfo">Otomatis tiap hari sesuai pengaturan.json.</span>
  </div>
  <div id="topik-list"></div>

  <h2>Naskah baru</h2>
  <form class="row" id="form">
    <input id="topik" placeholder="Topik video, mis. kenapa uang gaji cepat habis" required>
    <button>Minta Maya menulis</button>
  </form>

  <h2>Naskah</h2>
  <div id="naskah"></div>

  <h2>Video</h2>
  <div id="video-list"></div>

  <h2>Riwayat job</h2>
  <div id="jobs" class="mut"></div>
</main>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.js" } }</script>
<script type="module">
  // Kantor 3D bersifat tambahan: bila WebGL tidak tersedia, dashboard tetap jalan tanpa adegan.
  try {
    const { mulaiKantor3D } = await import("/kantor3d.js");
    const el = document.getElementById("scene3d"); el.hidden = false;
    const k = mulaiKantor3D(el, () => fetch("/api/status").then((r) => r.json()));
    document.getElementById("demo3d").addEventListener("click", (e) => {
      const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
      e.currentTarget.setAttribute("aria-pressed", String(on)); e.currentTarget.textContent = on ? "Hentikan demo" : "Demo animasi"; k.setDemo(on);
    });
  } catch (e) { console.warn("Kantor 3D tidak aktif:", e); document.getElementById("scene3d").hidden = true; }
</script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const api = (p, o) => fetch(p, o).then((r) => r.json());
const post = (p, b) => api(p, { method:"POST", headers:{ "content-type":"application/json" }, body:JSON.stringify(b ?? {}) });

let akunRepliz = null;
/** Nilai default datetime-local: jam posting terdekat yang belum lewat (waktu lokal browser). */
function jadwalDefault(jam = "16:00") {
  const [h, m] = jam.split(":").map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0);
  if (d.getTime() < Date.now() + 5 * 60_000) d.setDate(d.getDate() + 1);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
$("#video-list").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-p]"); if (!b) return;
  const box = b.closest(".post");
  if (!box.querySelector(".jadwal").value) return alert("Isi waktu jadwal dulu.");
  const r = await post(`/api/video/${box.dataset.vid}/posting`, {
    akunId: box.querySelector(".akun").value,
    caption: box.querySelector(".caption").value,
    jadwal: new Date(box.querySelector(".jadwal").value).toISOString(),
  });
  if (r.error) alert(r.error);
  $("#video-list").dataset.h = ""; muat();
});

async function muat() {
  const [agents, naskah, jobs, tp, videos, pst] = await Promise.all([api("/api/agents"), api("/api/naskah"), api("/api/jobs"), api("/api/topik"), api("/api/video"), api("/api/posting")]);
  if (!akunRepliz) akunRepliz = await api("/api/repliz/akun");  // sekali saja, jangan memanggil Repliz tiap 3 detik
  const postingPerVideo = {};
  pst.posting.forEach((x) => (postingPerVideo[x.video_id] ||= []).push(x));
  const modeKirim = pst.kirimNyata ? "" : `<div class="mut" style="margin-top:6px">Mode uji (dry-run): jadwal hanya dicatat, belum dikirim ke Repliz. Ubah <code>repliz.kirimNyata</code> di pengaturan.json untuk kirim nyata.</div>`;
  const opsiAkun = akunRepliz.akun.length
    ? `<select class="akun">${akunRepliz.akun.map((a) => `<option value="${esc(a.id)}">${esc(a.nama)}${a.platform ? " (" + esc(a.platform) + ")" : ""}</option>`).join("")}</select>`
    : `<input class="akun" placeholder="ID akun Repliz" title="${esc(akunRepliz.error || "")}">`;
  const sibuk = new Set(videos.filter((v) => ["menyiapkan", "suara", "render"].includes(v.status)).map((v) => v.naskah_id));
  const judulNaskah = Object.fromEntries(naskah.map((n) => [n.id, n.judul || n.topik]));
  // Jangan bangun ulang <video> yang sedang diputar: hanya render ulang bila datanya berubah.
  const vhtml = videos.map((v) => `<div class="card">
      <div class="row"><b>${esc(judulNaskah[v.naskah_id] ?? "Naskah #" + v.naskah_id)}</b><span class="tag ${v.status === "selesai" ? "disetujui" : v.status}">${v.status}</span>
      <span class="mut">#${v.id}${v.sumber_suara ? " · suara: " + v.sumber_suara : ""}${v.durasi ? " · " + v.durasi.toFixed(0) + " dtk" : ""}</span></div>
      ${v.error ? `<div class="mut">${esc(v.error.slice(0, 300))}</div>` : ""}
      ${v.file ? `<video controls preload="metadata" src="/video/${esc(v.file)}" style="height:420px;margin-top:8px;border-radius:8px"></video>` : ""}
      ${v.file ? `<div class="post" data-vid="${v.id}" style="margin-top:10px">
        <div class="row">${opsiAkun}<input class="jadwal" type="datetime-local" value="${jadwalDefault(pst.jamPosting[0])}" style="flex:0 0 auto"></div>
        <div class="row" style="margin-top:8px"><input class="caption" placeholder="Caption (kosong = pakai judul)" value="${esc(judulNaskah[v.naskah_id] ?? "")}"><button data-p="jadwalkan">Jadwalkan</button></div>
        ${(postingPerVideo[v.id] || []).map((x) => `<div class="mut">Posting #${x.id}: <span class="tag ${x.status === "gagal" ? "gagal" : "disetujui"}">${x.status}</span> ${new Date(x.jadwal).toLocaleString()}${x.error ? " · " + esc(x.error.slice(0, 200)) : ""}</div>`).join("")}
        ${modeKirim}</div>` : ""}</div>`).join("") || `<div class="mut">Belum ada video. Setujui naskah, lalu klik Buat video.</div>`;
  if ($("#video-list").dataset.h !== vhtml) { $("#video-list").innerHTML = vhtml; $("#video-list").dataset.h = vhtml; }
  $("#riset").disabled = tp.sedangRiset;
  $("#risetInfo").textContent = tp.sedangRiset ? "Rina sedang riset…" : "Otomatis tiap hari sesuai pengaturan.json.";
  $("#topik-list").innerHTML = tp.topik.filter((t) => t.status === "baru").map((t) => {
    const src = JSON.parse(t.sumber || "[]");
    return `<div class="card"><b>${esc(t.judul)}</b><div class="mut">${esc(t.ringkasan)}</div>
      ${src.length ? `<div class="mut">${src.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(new URL(u, "http://x").hostname)}</a>`).join(" · ")}</div>` : ""}
      <div class="row" style="margin-top:8px"><button data-t="tulis" data-id="${t.id}">Tulis naskah</button><button class="ghost" data-t="buang" data-id="${t.id}">Buang</button></div></div>`;
  }).join("") || `<div class="mut">Belum ada topik baru.</div>`;
  $("#agents").innerHTML = agents.map((a) =>
    `<span class="card" style="margin:0"><b>${esc(a.nama)}</b> <span class="mut">${esc(a.jabatan)}</span> <span class="tag">${a.aktif ? "siap" : "belum aktif"}</span></span>`).join("");
  $("#naskah").innerHTML = naskah.map((n) => {
    const visual = JSON.parse(n.rencana_visual || "[]");
    const aksi = n.status === "menunggu" ? `
      <div class="row" style="margin-top:10px">
        <button class="ok" data-a="setujui" data-id="${n.id}">Setujui</button>
        <button class="bad" data-a="tolak" data-id="${n.id}">Tolak</button>
        <input id="cat${n.id}" placeholder="Catatan revisi…"><button class="ghost" data-a="revisi" data-id="${n.id}">Revisi</button>
      </div>` : n.status === "disetujui"
        ? `<div class="row" style="margin-top:10px"><button data-a="video" data-id="${n.id}" ${sibuk.has(n.id) ? "disabled" : ""}>Buat video</button></div>` : "";
    return `<div class="card">
      <div class="row"><b>${esc(n.judul || n.topik)}</b><span class="tag ${n.status}">${n.status}</span><span class="mut">v${n.versi} · #${n.id}</span></div>
      ${n.isi ? `<pre>${esc(n.isi)}</pre>` : `<div class="mut">Topik: ${esc(n.topik)}</div>`}
      ${visual.length ? `<div class="mut">Rencana visual:<ul>${visual.map((v) => `<li>${esc(v)}</li>`).join("")}</ul></div>` : ""}
      ${aksi}</div>`;
  }).join("") || `<div class="mut">Belum ada naskah.</div>`;
  $("#jobs").innerHTML = jobs.map((j) =>
    `#${j.id} ${esc(j.agent)} — ${j.status}${j.biaya_usd ? ` · $${j.biaya_usd.toFixed(3)}` : ""}${j.error ? ` · ${esc(j.error.slice(0,120))}` : ""}`).join("<br>") || "Belum ada job.";
}

$("#form").addEventListener("submit", async (e) => {
  e.preventDefault();
  await post("/api/naskah", { topik: $("#topik").value });
  $("#topik").value = ""; muat();
});
$("#riset").addEventListener("click", async () => { await post("/api/riset"); muat(); });
$("#topik-list").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-t]"); if (!b) return;
  await post(`/api/topik/${b.dataset.id}/${b.dataset.t}`); muat();
});
$("#naskah").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const { a, id } = b.dataset;
  if (a === "revisi") {
    const catatan = $("#cat" + id).value.trim();
    if (!catatan) return alert("Isi catatan revisi dulu.");
    await post(`/api/naskah/${id}/revisi`, { catatan });
  } else {
    const r = await post(`/api/naskah/${id}/${a}`);
    if (r.error) alert(r.error);
  }
  muat();
});
muat(); setInterval(muat, 3000);
</script>
</body>
</html>
